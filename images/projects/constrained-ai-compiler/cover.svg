<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">971-cycle constrained AI compiler</title>
  <desc id="desc">A dark compiler performance visual showing a 971 cycle result, a 999 cycle Fable 5 baseline, and a scheduled vector pipeline.</desc>
  <rect width="1400" height="900" fill="#17241f"/>
  <g opacity=".16" stroke="#d9f780" stroke-width="1">
    <path d="M80 0v900M160 0v900M240 0v900M320 0v900M400 0v900M480 0v900M560 0v900M640 0v900M720 0v900M800 0v900M880 0v900M960 0v900M1040 0v900M1120 0v900M1200 0v900M1280 0v900"/>
    <path d="M0 80h1400M0 160h1400M0 240h1400M0 320h1400M0 400h1400M0 480h1400M0 560h1400M0 640h1400M0 720h1400M0 800h1400"/>
  </g>
  <g fill="#d9f780" font-family="Arial, Helvetica, sans-serif">
    <text x="80" y="92" font-size="22" letter-spacing="5">ANTHROPIC / PERFORMANCE TAKE-HOME</text>
    <text x="80" y="225" font-size="185" font-weight="700" letter-spacing="-10">971</text>
    <text x="98" y="278" font-size="25" letter-spacing="6">SIMULATED CYCLES</text>
  </g>
  <g fill="#eef2e9" font-family="Arial, Helvetica, sans-serif">
    <text x="850" y="145" font-size="24" letter-spacing="3">AHEAD OF THE BASELINE</text>
    <text x="850" y="205" font-size="42" font-weight="700">FABLE 5 / 999</text>
    <text x="850" y="247" font-size="20" opacity=".75">28 cycles faster</text>
  </g>
  <g transform="translate(80 390)">
    <g fill="none" stroke="#d9f780" stroke-width="4">
      <path d="M0 50h220l42 70h210l42-70h220l42 70h220"/>
      <path d="M0 180h140l42-70h190l42 70h180l42-70h230l42 70h210" opacity=".55"/>
    </g>
    <g fill="#d9f780">
      <rect x="12" y="28" width="100" height="44" rx="4"/>
      <rect x="140" y="28" width="65" height="44" rx="4"/>
      <rect x="300" y="98" width="150" height="44" rx="4"/>
      <rect x="552" y="28" width="112" height="44" rx="4"/>
      <rect x="720" y="98" width="180" height="44" rx="4"/>
      <rect x="1000" y="28" width="160" height="44" rx="4"/>
    </g>
    <g fill="#17241f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">
      <text x="33" y="57">IR</text><text x="158" y="57">SIMD</text><text x="326" y="127">ALLOCATE</text><text x="580" y="57">VLIW</text><text x="754" y="127">VERIFY</text><text x="1032" y="57">WRITEBACK</text>
    </g>
  </g>
  <g fill="#eef2e9" font-family="Arial, Helvetica, sans-serif" font-size="22">
    <text x="82" y="720">9 / 9 OFFICIAL TESTS</text>
    <text x="430" y="720">50 / 50 EXACT RERUNS</text>
    <text x="890" y="720">TOP 5% COMMUNITY BOARD</text>
  </g>
  <path d="M80 770h1240" stroke="#d9f780" stroke-width="2" opacity=".6"/>
  <text x="80" y="835" fill="#eef2e9" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="2">DEPENDENCIES / SCHEDULING / MEMORY / PROOF</text>
</svg>
