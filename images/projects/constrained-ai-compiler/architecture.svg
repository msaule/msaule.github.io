<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">Constrained compiler architecture</title>
  <desc id="desc">A five-stage compiler and verification architecture diagram.</desc>
  <rect width="1400" height="850" fill="#e1e3da"/>
  <g fill="#1b2722" font-family="Arial, Helvetica, sans-serif">
    <text x="80" y="90" font-size="22" letter-spacing="4">THE PIPELINE</text>
    <text x="80" y="170" font-size="70" font-weight="700" letter-spacing="-3">From dependency graph</text>
    <text x="80" y="245" font-size="70" font-weight="700" letter-spacing="-3">to exact schedule.</text>
  </g>
  <g stroke="#244333" stroke-width="3" fill="#f7f6f0">
    <rect x="80" y="365" width="205" height="170" rx="8"/>
    <rect x="335" y="365" width="205" height="170" rx="8"/>
    <rect x="590" y="365" width="205" height="170" rx="8"/>
    <rect x="845" y="365" width="205" height="170" rx="8"/>
    <rect x="1100" y="365" width="205" height="170" rx="8"/>
    <path d="M285 450h50M540 450h50M795 450h50M1050 450h50" fill="none"/>
    <path d="m325 440 10 10-10 10m255-10 10 10-10 10m255-10 10 10-10 10m255-10 10 10-10 10" fill="none"/>
  </g>
  <g fill="#244333" font-family="Arial, Helvetica, sans-serif">
    <g font-size="18" font-weight="700">
      <text x="110" y="410">01 / IR</text><text x="365" y="410">02 / SCHEDULE</text><text x="620" y="410">03 / ALLOCATE</text><text x="875" y="410">04 / EMIT</text><text x="1130" y="410">05 / VERIFY</text>
    </g>
    <g font-size="18">
      <text x="110" y="455">Dependencies</text><text x="110" y="485">Widths + memory</text>
      <text x="365" y="455">VLIW issue</text><text x="365" y="485">Critical path</text>
      <text x="620" y="455">Vector lifetimes</text><text x="620" y="485">Scratch binding</text>
      <text x="875" y="455">971 bundles</text><text x="875" y="485">AOT + dynamic</text>
      <text x="1130" y="455">Values</text><text x="1130" y="485">Indices</text>
    </g>
  </g>
  <g fill="#1b2722" font-family="Arial, Helvetica, sans-serif">
    <text x="80" y="650" font-size="23" font-weight="700">The result</text>
    <text x="80" y="705" font-size="46" font-weight="700">971 cycles</text>
    <text x="390" y="705" font-size="28">28 ahead of Fable 5 / 999</text>
    <text x="390" y="748" font-size="20" opacity=".7">9/9 official tests  |  50/50 exact reruns  |  unchanged test tree</text>
  </g>
</svg>
