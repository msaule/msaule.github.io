<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">MSRA case construction method</title><desc id="description">A four-stage diagram for designing a difficult value-reasoning case</desc>
  <style>.m{font-family:"Fragment Mono","IBM Plex Mono",monospace;font-size:21px;letter-spacing:1px}.h{font-family:"Spline Sans","Helvetica Neue",sans-serif;font-size:50px;font-weight:600;letter-spacing:-2px;fill:#ecebe4}.p{font-family:"Spline Sans","Helvetica Neue",sans-serif;font-size:25px;fill:#aeb0a8}.n{font-family:"Fragment Mono","IBM Plex Mono",monospace;font-size:48px;fill:#d9ff43}</style>
  <rect width="1600" height="900" fill="#0c0d0c"/><rect width="12" height="900" fill="#d9ff43"/><text x="72" y="92" class="m" fill="#d9ff43">CASE DESIGN / RESEARCH METHOD</text><line x1="72" y1="138" x2="1528" y2="138" stroke="#33362f" stroke-width="2"/>
  <g transform="translate(72 218)"><text class="n" x="0" y="0">01</text><text class="h" x="0" y="76">Ground the context.</text><text class="p" x="0" y="126">Start from a real institution, technology,</text><text class="p" x="0" y="162">or policy direction; separate facts from fiction.</text></g>
  <g transform="translate(440 218)"><text class="n" x="0" y="0">02</text><text class="h" x="0" y="76">Hold the conflict.</text><text class="p" x="0" y="126">Give both sides a serious human interest.</text><text class="p" x="0" y="162">Remove the easy rule or obvious answer.</text></g>
  <g transform="translate(808 218)"><text class="n" x="0" y="0">03</text><text class="h" x="0" y="76">Set a boundary.</text><text class="p" x="0" y="126">Make the action, authority, and conditions</text><text class="p" x="0" y="162">for revisiting the decision explicit.</text></g>
  <g transform="translate(1176 218)"><text class="n" x="0" y="0">04</text><text class="h" x="0" y="76">Test the objection.</text><text class="p" x="0" y="126">State the strongest opposing case before</text><text class="p" x="0" y="162">defending the conclusion.</text></g>
  <line x1="72" y1="520" x2="1528" y2="520" stroke="#33362f" stroke-width="2"/>
  <text x="72" y="610" class="m" fill="#96998f">THE RESULT</text><text x="72" y="690" class="h">A decision a model cannot answer by retrieving a rule.</text><text x="72" y="744" class="p">Each selected case requires value judgment under uncertainty, with a reasoned answer and a visible point of disagreement.</text>
</svg>
